<h1>Neues Projekt</h1>

<form>

    <label for="id">ID:</label><br>
    <input type="text" id="id" name="id"><br><br>

    <label for="title">Titel:</label><br>
    <input type="text" id="title" name="title"><br><br>

    <label for="description">Beschreibung:</label><br>
    <textarea id="description" name="description"></textarea><br><br>

    <label for="file">Markdown Datei:</label><br>
    <input type="text" id="file" name="file" placeholder="projects/xyz.md"><br><br>

    <label for="github">GitHub Link:</label><br>
    <input type="text" id="github" name="github"><br><br>

    <label for="tech">Tech Stack (kommagetrennt):</label><br>
    <input type="text" id="tech" name="tech"><br><br>

    <label for="updated">Updated:</label><br>
    <input type="date" id="updated" name="updated"><br><br>

    <button type="submit">Projekt speichern</button>

</form>


<h1>Neuer Blog Post</h1>

<form>

    <label for="title">Titel:</label><br>
    <input type="text" id="title" name="title"><br><br>

    <label for="file">Markdown Datei:</label><br>
    <input type="text" id="file" name="file" placeholder="../posts/..."><br><br>

    <label for="github">GitHub Datei:</label><br>
    <input type="text" id="github" name="github"><br><br>

    <label for="updated">Updated:</label><br>
    <input type="date" id="updated" name="updated"><br><br>

    <label for="intro">Intro:</label><br>
    <textarea id="intro" name="intro"></textarea><br><br>

    <button type="submit">Post speichern</button>

</form>

<!--

Die Struktur ist folgende:

in projects.json:

er erkennt ob "tech" gesetzt ist und zieht es basierend darauf hinein

Bsp.:
    {
      "id":"LowLatencyMarketDataPipeline",
      "title":"Low Latency Market Data Pipeline",
      "description":"A small low latency pipline to transfer signals.",
      "file":"projects/low_latency_pipeline.md",
      "github": "https://github.com/striker011/Projects/tree/main/source/Low_Latency_Market_Data_Pipeline",
      "tech": ["C++", "C", "lockless Ringbuffer", "multithreading"],
      "updated": "2026-01-22"
    },



in techStack.json:

wird techList ein Eintrag hinzugefügt mit "tech" und "date", das eigentlich eher für update stehen sollte

    "techList":[
        {
            "tech": "C",
            "date":"2025-12-27"
        },


in topics.json:

wird "Projects" ein Eintrag hinzugefügt, mit titel, github link, updated,file und intro. 

Es gibt die folgende Ordnerstruktur:

Projects/docs/data/.json...
Projects/docs/posts/{Unterordner}/.md...
Projects/docs/html/.html...
Projects/docs/js/.js...

Projects/source/{Projektordner Name}/.md...
Projects/source/{Projektordner Name}/source files...


so sieht ein richtiger github link aus:
 "github":"Low_Latency_Market_Data_Pipeline/LowLatencyMarketDataPipeline.md",

  "Projects":[
    {
      "title" : "Low Latency Pipeline",
      "file" : "../../source/Low_Latency_Market_Data_Pipeline/LowLatencyMarketDataPipeline.md",
      "github":"Low_Latency_Market_Data_Pipeline/LowLatencyMarketDataPipeline.md",
      "updated":"2026-01-22",
      "intro":"Übersicht über meine Low Latency Pipeline"
    },
    {
        "title" : "ML Basics",
        "file": "../posts/ai/ml_basics.md",
        "github":"ml_basics.md",
        "updated" :"2026-02-04",
        "intro":"Intro in Machine Learning Modelle"
    }


    Man kann entweder ein Projekt anlegen oder einen Blog Post
